[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-system-health-monitor"
version = "0.1.0"
description = "Comprehensive system health monitoring tool for Linux with HP fan control integration"
requires-python = ">=3.10"
dependencies = ["psutil"]

[project.scripts]
health-monitor = "main:main"

[project.optional-dependencies]
dev = ["pytest"]
